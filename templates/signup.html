<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Marketplace</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="brand-logo">🛍</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join our marketplace today</p>
        </div>

        <!-- Account Type Toggle -->
        <div class="role-toggle">
            <label class="role-option">
                <input type="radio" name="user_type" value="customer" checked>
                <span class="role-btn">
                    <span class="role-icon">🛒</span>
                    Customer
                </span>
            </label>
            <label class="role-option">
                <input type="radio" name="user_type" value="seller">
                <span class="role-btn">
                    <span class="role-icon">🏪</span>
                    Seller
                </span>
            </label>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <form id="signupForm">

            <div class="field-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="field-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="field-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" placeholder="01XXXXXXXXX">
            </div>

            <div class="field-group" id="addressGroup">
                <label for="address" id="addressLabel">Delivery Address</label>
                <input type="text" id="address" placeholder="Enter your address">
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">Create Account</span>
                <span id="btnLoader" class="spinner hidden"></span>
            </button>

        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </p>

    </div>
</div>

<script src="/static/signup.js"></script>

</body>
</html>
